name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # The application runs on PostgreSQL in production, so it is tested on
    # PostgreSQL. A suite that runs on a different engine than production is a
    # suite that cannot see engine-specific bugs.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: studioops
          POSTGRES_PASSWORD: studioops
          POSTGRES_DB: studio_ops_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: studio_ops_api_test
      DB_USERNAME: studioops
      DB_PASSWORD: studioops
      DB_SSLMODE: prefer

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
