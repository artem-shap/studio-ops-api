name: audit

# A dependency can turn vulnerable without a single commit landing here, so
# this runs on a timer as well as on push. It covers what ships: Composer's
# production packages and the admin panel's runtime JavaScript. Dev-only
# advisories never reach a user and are left to the weekly local check.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Audit Composer packages
        run: composer audit --no-dev --locked

      - name: Audit runtime JavaScript
        run: pnpm audit --prod --audit-level=high
